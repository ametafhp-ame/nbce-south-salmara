<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102b45"><title>New PAN Card Apply | NBCE South Salmara</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--navy:#102b45;--blue:#2563eb;--bg:#f5f7fb;--ink:#172b42;--muted:#687b91;--line:#dbe3ed;--green:#087f5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,Segoe UI,Arial,sans-serif}a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:900px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:58px;height:58px;object-fit:contain}.brand strong{display:block;color:var(--navy);font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.5px}
.home-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:700;background:#edf3fa;color:var(--navy);white-space:nowrap}
main{max-width:760px;margin:auto;padding:28px 22px 42px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}h1{font-size:clamp(25px,4vw,34px);margin:0 0 8px;color:var(--navy);letter-spacing:-.7px}.intro{margin:0 0 22px;color:var(--muted);line-height:1.6}
.form-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 24px rgba(16,43,69,.06)}.field{margin-bottom:20px}label,.field-title{display:block;font-weight:700;color:var(--navy);margin-bottom:8px}.required{color:#dc2626}input[type=tel],select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:13px 14px;font:inherit;color:var(--ink);background:#fff;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}.hint{font-size:12px;line-height:1.5;color:var(--muted);margin:7px 0 0}
.upload-box{border:1.5px dashed #a8bfdc;background:#f8fbff;border-radius:12px;padding:16px}input[type=file]{width:100%;font:inherit;font-size:13px}.preview{display:none;margin-top:12px;max-width:180px;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:white}.file-name{font-size:12px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.notice{background:#fff8e8;border:1px solid #f1d59b;color:#785313;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.55;margin:8px 0 20px}.submit{width:100%;border:0;border-radius:10px;background:var(--blue);color:white;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer}.submit:hover{background:#1d4ed8}.backlink{display:block;text-align:center;margin-top:18px;color:var(--blue);font-size:13px;font-weight:700}.message{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.message.error{display:block;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}.message.info{display:block;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}.upload-progress{display:none;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#f8fbff}.progress-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:800;color:var(--navy);margin-bottom:9px}.progress-track{height:10px;background:#dbe7f4;border-radius:999px;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--green);border-radius:999px;transition:width .2s}.progress-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}.cancel-upload{border:1px solid #f87171;background:#fff;color:#b91c1c;border-radius:8px;padding:8px 12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.cancel-upload:disabled{opacity:.55;cursor:not-allowed}footer{text-align:center;padding:0 16px 24px;color:#8491a0;font-size:12px}
@media(max-width:560px){.header-inner{padding:12px 14px;gap:8px}.brand img{width:46px;height:46px}.brand strong{font-size:14px}.brand small{font-size:9px}.home-btn{font-size:12px;padding:9px}main{padding:22px 14px 32px}}
</style></head><body>
<header><div class="header-inner"><a class="brand" href="home.html"><img src="logo.png" alt="NBCE South Salmara logo"><span><strong>NBCE South Salmara</strong><small>DIGITAL SERVICE CENTRE</small></span></a><a class="home-btn" href="pan-card-services.html">← PAN Services</a></div></header>
<main><h1>New PAN Card Apply</h1>
<form class="form-card" id="requestForm" novalidate>
<div class="field"><label for="whatsapp">WhatsApp Number <span class="required">*</span></label><div style="display:flex;align-items:stretch;gap:0"><span style="display:flex;align-items:center;padding:0 14px;border:1px solid #cbd5e1;border-right:0;border-radius:10px 0 0 10px;background:#edf3fa;color:var(--navy);font-weight:800">+91</span><input id="whatsapp" name="whatsapp" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="Enter 10-digit number" required style="border-radius:0 10px 10px 0"></div><p class="hint">+91 is fixed. Enter only 10 digits.</p></div><div class="field"><label for="aadhaarPhoto">Aadhaar Card Photo <span class="required">*</span></label><div class="upload-box"><input id="aadhaarPhoto" name="aadhaarPhoto" type="file" accept="image/*" required><img class="preview" id="aadhaarPhotoPreview" alt="Selected document preview"><div class="file-name" id="aadhaarPhotoName"></div></div></div><div class="field"><label for="otherDocumentType">Other Document Type <span class="required">*</span></label><select id="otherDocumentType" name="otherDocumentType" required><option value="">Choose a document</option><option value="Birth Certificate">Birth Certificate</option><option value="Voter ID">Voter ID</option></select></div><div class="field"><label for="otherDocumentPhoto">Other Document Photo <span class="required">*</span></label><div class="upload-box"><input id="otherDocumentPhoto" name="otherDocumentPhoto" type="file" accept="image/*" required><img class="preview" id="otherDocumentPhotoPreview" alt="Selected document preview"><div class="file-name" id="otherDocumentPhotoName"></div></div></div>

<button class="submit" type="submit">Submit Request →</button><div id="uploadProgress" class="upload-progress" aria-live="polite"><div class="progress-head"><span id="progressLabel">Preparing upload…</span><span id="progressPercent">0%</span></div><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div><div class="progress-foot"><span id="progressDetail">Getting documents ready</span><button type="button" id="cancelUpload" class="cancel-upload">Cancel</button></div></div><div id="formMessage" class="message" role="status"></div>
<a class="backlink" href="pan-card-services.html">← Back to PAN Card Services</a>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hizimlfplecwyqdjvaze.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nV764Rar0ofHGPJAkukczA_vYA_ztNU";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = "customer-documents";
const requestForm = document.getElementById('requestForm');
const formMessage = document.getElementById('formMessage');
const progressBox = document.getElementById('uploadProgress');
const progressLabel = document.getElementById('progressLabel');
const progressPercent = document.getElementById('progressPercent');
const progressFill = document.getElementById('progressFill');
const progressDetail = document.getElementById('progressDetail');
const cancelButton = document.getElementById('cancelUpload');
const submitButton = requestForm.querySelector('button[type="submit"]');
let cancelled = false;
let busy = false;
let activeUploads = [];

function setupPreview(inputId, previewId, nameId) {
 const input=document.getElementById(inputId), preview=document.getElementById(previewId), name=document.getElementById(nameId);
 input.addEventListener('change',()=>{
  const file=input.files&&input.files[0];
  if(!file){preview.style.display='none';name.textContent='';return;}
  name.textContent=file.name+' ('+(file.size/1024/1024).toFixed(2)+' MB)';
  if(file.type.startsWith('image/')){if(preview.dataset.objectUrl)URL.revokeObjectURL(preview.dataset.objectUrl);preview.dataset.objectUrl=URL.createObjectURL(file);preview.src=preview.dataset.objectUrl;preview.style.display='block';}
  else preview.style.display='none';
 });
}
setupPreview('aadhaarPhoto','aadhaarPhotoPreview','aadhaarPhotoName');
setupPreview('otherDocumentPhoto','otherDocumentPhotoPreview','otherDocumentPhotoName');

function setProgress(percent,label,detail){
 progressBox.style.display='block';
 progressLabel.textContent=label;
 progressPercent.textContent=percent+'%';
 progressFill.style.width=percent+'%';
 progressDetail.textContent=detail;
}
function showMessage(kind,message){formMessage.className='message '+kind;formMessage.textContent=message;}
function safeName(name){return name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-100)||'document';}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
cancelButton.addEventListener('click',()=>{
 if(busy){cancelled=true;cancelButton.disabled=true;progressDetail.textContent='Cancelling upload…';return;}
 progressBox.style.display='none';
});
requestForm.addEventListener('submit',async e=>{
 e.preventDefault();
 if(busy)return;
 if(!requestForm.reportValidity())return;
 const phone=document.getElementById('whatsapp').value.trim();
 if(!/^[6-9]\d{9}$/.test(phone)){showMessage('error','Enter a valid 10-digit Indian WhatsApp number.');return;}
 const files=[
  {file:document.getElementById('aadhaarPhoto').files[0],label:'Aadhaar Card Photo'},
  {file:document.getElementById('otherDocumentPhoto').files[0],label:document.getElementById('otherDocumentType').value+' Photo'}
 ];
 for(const item of files){
  if(!item.file||!item.file.type.startsWith('image/')){showMessage('error','Please select valid image files for both documents.');return;}
  if(item.file.size>8*1024*1024){showMessage('error','Each image must be 8 MB or smaller.');return;}
  if(!['image/jpeg','image/png','image/webp'].includes(item.file.type)){showMessage('error','Only JPG, PNG, or WEBP images are allowed.');return;}
 }
 busy=true;cancelled=false;activeUploads=[];submitButton.disabled=true;submitButton.textContent='Submitting…';cancelButton.disabled=false;cancelButton.textContent='Cancel Upload';showMessage('info','Uploading documents securely. Please keep this page open.');
 const uploaded=[];
 try{
  for(let idx=0;idx<files.length;idx++){
   if(cancelled)throw new Error('Upload cancelled.');
   const item=files[idx],path='panRequests/'+Date.now()+'_'+crypto.randomUUID()+'_'+safeName(item.file.name);
   setProgress(Math.round((idx/files.length)*80),'Uploading '+item.label,`Document ${idx+1} of ${files.length}`);
   const {data,error}=await supabaseClient.storage.from(BUCKET).upload(path,item.file,{cacheControl:'3600',upsert:false,contentType:item.file.type});
   if(error)throw error;
   uploaded.push({path,name:item.file.name,label:item.label});
   activeUploads.push(path);
   setProgress(Math.round(((idx+1)/files.length)*80),'Uploading documents',`${idx+1} of ${files.length} uploaded`);
  }
  if(cancelled)throw new Error('Upload cancelled.');
  setProgress(90,'Saving request','Recording the PAN request');
  const docType=document.getElementById('otherDocumentType').value;
  const payload={
   service:'New PAN Card Apply',
   whatsapp_number:'+91'+phone,
   receipt_file_name:uploaded.map(x=>x.name).join(', '),
   storage_path:uploaded[0].path,
   status:'pending',
   additional_note:JSON.stringify({documentFiles:uploaded.map(x=>({label:x.label,name:x.name,storage_path:x.path})),otherDocumentType:docType})
  };
  const {error:dbError}=await supabaseClient.from('pan_requests').insert(payload);
  if(dbError)throw dbError;
  setProgress(100,'Request submitted','Your PAN request was submitted successfully.');
  showMessage('info','PAN Card request submitted successfully. Please keep your WhatsApp available for updates.');
  requestForm.reset();
  for(const id of ['aadhaarPhotoPreview','otherDocumentPhotoPreview'])document.getElementById(id).style.display='none';
  for(const id of ['aadhaarPhotoName','otherDocumentPhotoName'])document.getElementById(id).textContent='';
  await delay(2000);progressBox.style.display='none';
 }catch(err){
  console.error('PAN request submission error:',err);
  if(cancelled){
   for(const path of uploaded.map(x=>x.path)){try{await supabaseClient.storage.from(BUCKET).remove([path]);}catch(cleanupError){console.warn(cleanupError);}}
   showMessage('info','Upload cancelled. You can choose different photos and try again.');
   progressBox.style.display='none';
  }else{
   setProgress(0,'Submission failed','Check connection and Supabase permissions, then try again.');
   showMessage('error','Could not submit the PAN request: '+(err?.message||String(err))+' . If upload succeeded but database saving failed, the uploaded files may remain in Storage.');
  }
 }finally{busy=false;submitButton.disabled=false;submitButton.textContent='Submit Request →';cancelButton.disabled=false;cancelButton.textContent='Close';}
});
</script></body></html>
