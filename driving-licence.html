<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102b45"><title>Driving Licence Assistance | NBCE South Salmara</title>
<style>
:root{--navy:#102b45;--blue:#2563eb;--bg:#f4f7fb;--ink:#172b42;--muted:#687b91;--line:#dbe3ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:960px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:56px;height:56px;object-fit:contain;flex-shrink:0}.brand strong{display:block;color:var(--navy);font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.4px}.home-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:11px 14px;font-size:13px;font-weight:700;background:#edf3fa;color:var(--navy);white-space:nowrap}main{width:100%;max-width:760px;margin:30px auto;padding:0 20px 34px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(22px,4vw,36px);box-shadow:0 10px 30px #102b590d}h1{font-size:clamp(26px,4vw,32px);line-height:1.2;color:var(--navy);margin:0 0 25px}label{display:block;font-size:15px;font-weight:700;margin:18px 0 8px}input,select{display:block;width:100%;min-width:0;min-height:49px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;font-size:16px;color:var(--ink);background:#fff}input:focus,select:focus{outline:2px solid #8db7f0;outline-offset:1px;border-color:var(--blue)}input[type=file]{padding:10px;background:#fbfdff}.upload{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fbfdff}.preview{display:none;margin-top:12px;max-width:100%;max-height:190px;border-radius:8px;border:1px solid var(--line);object-fit:contain}.preview.show{display:block}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:49px;border:0;border-radius:10px;padding:13px 16px;font-size:15px;line-height:1.35;font-weight:700;cursor:pointer;text-align:center;margin-top:22px}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--navy);margin-top:12px}.status{display:none;padding:13px;border-radius:9px;margin-top:15px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.status.show{display:block}.error{background:#fff1f1;color:#9b1c1c}@media(max-width:560px){.header-inner{padding:12px 14px;gap:8px}.brand img{width:46px;height:46px}.brand strong{font-size:14px}.brand small{font-size:9px}.home-btn{font-size:12px;padding:9px 10px}main{margin:18px auto;padding:0 12px 24px}.card{padding:22px 17px}label{margin-top:16px}.btn{font-size:14px}}
</style></head><body>
<header><div class="header-inner"><a class="brand" href="home.html"><img src="logo.png" alt="NBCE South Salmara logo"><span><strong>NBCE South Salmara</strong><small>DIGITAL SERVICE CENTRE</small></span></a><a class="home-btn" href="home.html">← Home</a></div></header>
<main><section class="card"><h1>Driving Licence Assistance</h1><form id="drivingForm">
<label for="whatsappNumber">WhatsApp Number *</label><input id="whatsappNumber" name="whatsappNumber" type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" autocomplete="tel" placeholder="Enter 10-digit WhatsApp number" required>
<label for="bloodGroup">Blood Group *</label><select id="bloodGroup" name="bloodGroup" required><option value="">Select blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option><option>Unknown</option></select>
<label for="aadhaarPhoto">Aadhaar Card Photo *</label><div class="upload"><input id="aadhaarPhoto" name="aadhaarPhoto" type="file" accept="image/jpeg,image/png,image/webp" required><img id="aadhaarPreview" class="preview" alt="Aadhaar card photo preview"></div>
<button class="btn primary" type="submit">Submit Driving Licence Request</button></form><div id="status" class="status" role="status" aria-live="polite"></div><a class="btn secondary" href="home.html">Back to Home</a></section></main>
<script>
const $=id=>document.getElementById(id);function showStatus(message){const s=$("status");s.textContent=message;s.className="status show error";}
$("aadhaarPhoto").addEventListener("change",()=>{const f=$("aadhaarPhoto").files[0],img=$("aadhaarPreview");if(!f){img.removeAttribute("src");img.classList.remove("show");return;}if(!["image/jpeg","image/png","image/webp"].includes(f.type)){$("aadhaarPhoto").value="";img.removeAttribute("src");img.classList.remove("show");showStatus("Please choose a JPG, PNG or WEBP image.");return;}img.src=URL.createObjectURL(f);img.classList.add("show");});
$("drivingForm").addEventListener("submit",e=>{e.preventDefault();showStatus("The form is ready, but online submission is not connected yet. Connect Firebase or a secure backend to receive requests and the Aadhaar photo.");});
</script></body></html>
