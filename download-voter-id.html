<script>
const SUPABASE_URL = "https://hizimlfplecwyqdjvaze.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nV764Rar0ofHGPJAkukczA_vYA_ztNU";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const form=$("requestForm"),phoneInput=$("whatsappNumber"),submitButton=$("submitButton");
const statusBox=$("status"),progressPanel=$("progressPanel"),progressFill=$("progressFill"),progressPercent=$("progressPercent"),progressLabel=$("progressLabel"),cancelButton=$("cancelUpload");
const fileFields=[{id:'acknowledgementReceipt', label:'acknowledgementReceipt'}];
let activeXhr=null,uploadedPaths=[],uploading=false,cancelled=false,hideProgressTimer=null;
function showStatus(message,type="error"){statusBox.textContent=message;statusBox.className="status show "+type;}
function setProgress(value,label){const v=Math.max(0,Math.min(100,Math.round(value)));progressFill.style.width=v+"%";progressPercent.textContent=v+"%";if(label)progressLabel.textContent=label;}
function previewFile(inputId,previewId){const input=$(inputId),img=$(previewId);if(!input||!img)return;input.addEventListener("change",()=>{const f=input.files&&input.files[0];if(!f){img.removeAttribute("src");img.classList.remove("show");return;}if(!["image/jpeg","image/png","image/webp"].includes(f.type)){input.value="";img.removeAttribute("src");img.classList.remove("show");showStatus("Please choose a JPG, PNG or WEBP image.");return;}if(f.size>8*1024*1024){input.value="";img.removeAttribute("src");img.classList.remove("show");showStatus("Each image must be smaller than 8 MB.");return;}img.src=URL.createObjectURL(f);img.classList.add("show");});}
fileFields.forEach(item=>{if($(item.id+"Preview"))previewFile(item.id,item.id+"Preview");});
function uploadWithProgress(path,file,index,totalBytes,previousBytes){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();activeXhr=xhr;xhr.open("POST",`${SUPABASE_URL}/storage/v1/object/customer-documents/${path.split("/").map(encodeURIComponent).join("/")}`);xhr.setRequestHeader("apikey",SUPABASE_ANON_KEY);xhr.setRequestHeader("Authorization","Bearer "+SUPABASE_ANON_KEY);xhr.setRequestHeader("Content-Type",file.type||"application/octet-stream");xhr.setRequestHeader("x-upsert","false");xhr.upload.onprogress=e=>{if(e.lengthComputable)setProgress((previousBytes+e.loaded)/totalBytes*100,`Uploading photo ${index+1} of ${fileFields.length}…`);};xhr.onload=()=>{activeXhr=null;if(xhr.status>=200&&xhr.status<300)resolve();else{let detail="Storage upload failed ("+xhr.status+")";try{const j=JSON.parse(xhr.responseText);detail=j.message||j.error||detail;}catch{}reject(new Error(detail));}};xhr.onerror=()=>{activeXhr=null;reject(new Error("Network error during upload."));};xhr.onabort=()=>{activeXhr=null;reject(new Error("UPLOAD_CANCELLED"));};xhr.send(file);});}
async function cleanupUploads(){const paths=[...uploadedPaths];uploadedPaths=[];if(paths.length){try{await supabaseClient.storage.from("customer-documents").remove(paths);}catch(err){console.warn("Could not remove cancelled uploads",err);}}}
cancelButton.addEventListener("click",async()=>{if(!uploading)return;cancelled=true;cancelButton.disabled=true;if(activeXhr)activeXhr.abort();await cleanupUploads();progressPanel.style.display="none";showStatus("Upload cancelled. You can choose new photos and submit again.");submitButton.disabled=false;});
form.addEventListener("submit",async e=>{e.preventDefault();if(uploading)return;if(!form.reportValidity())return;const phone=phoneInput.value.trim();if(!/^[6-9]\d{9}$/.test(phone)){showStatus("Enter a valid 10-digit Indian WhatsApp number.");return;}
const files=[];for(const item of fileFields){const input=$(item.id),file=input&&input.files&&input.files[0];if(file){if(!["image/jpeg","image/png","image/webp"].includes(file.type)){showStatus("Please choose JPG, PNG or WEBP photos.");return;}if(file.size>8*1024*1024){showStatus("Each image must be smaller than 8 MB.");return;}files.push({file,label:item.label});}}
if(files.length===0){showStatus("Please select the required photo.");return;}
uploading=true;cancelled=false;uploadedPaths=[];clearTimeout(hideProgressTimer);submitButton.disabled=true;submitButton.textContent="Uploading…";cancelButton.disabled=false;progressPanel.style.display="block";setProgress(0,"Preparing upload…");showStatus("Please keep this page open while your request is submitted.","info");const totalBytes=files.reduce((sum,x)=>sum+x.file.size,0);let previousBytes=0;
try{const requestId=crypto.randomUUID(),paths=[];for(let i=0;i<files.length;i++){if(cancelled)throw new Error("UPLOAD_CANCELLED");const file=files[i].file;const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_").replace(/\.[^.]+$/,"");const ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";const path=`voterId/${Date.now()}_${crypto.randomUUID()}_${safeName}.${ext}`;await uploadWithProgress(path,file,i,totalBytes,previousBytes);uploadedPaths.push(path);paths.push(path);previousBytes+=file.size;if(cancelled)throw new Error("UPLOAD_CANCELLED");}
setProgress(100,"Saving request…");cancelButton.disabled=true;let serviceName='Download Voter ID Card';
const {error}=await supabaseClient.from("aadhaar_requests").insert({id:requestId,service:serviceName,whatsapp_number:"+91"+phone,receipt_file_name:files.map(x=>x.file.name).join(", "),storage_path:paths[0],status:"pending"});if(error)throw error;uploadedPaths=[];showStatus("Request submitted successfully. Reference ID: "+requestId+".","success");form.reset();fileFields.forEach(item=>{const img=$(item.id+"Preview");if(img){img.removeAttribute("src");img.classList.remove("show");}});setProgress(100,"Request submitted successfully");hideProgressTimer=setTimeout(()=>{progressPanel.style.display="none";},2000);
}catch(err){if(err.message==="UPLOAD_CANCELLED"||cancelled){await cleanupUploads();progressPanel.style.display="none";showStatus("Upload cancelled. You can choose new photos and submit again.");}else{console.error(err);await cleanupUploads();progressPanel.style.display="none";showStatus("Could not submit the request. Check Supabase Storage and database policies. Details: "+(err.message||"Unknown error"));}}finally{uploading=false;activeXhr=null;submitButton.disabled=false;submitButton.textContent="Submit Request";cancelButton.disabled=false;}});
</script></body></html>
