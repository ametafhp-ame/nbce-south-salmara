<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102b45"><title>Update Udyam Certificate | NBCE South Salmara</title><style>:root{--navy:#102b45;--blue:#2563eb;--bg:#f4f7fb;--ink:#172b42;--muted:#687b91;--line:#dbe3ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:900px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:56px;height:56px;object-fit:contain}.brand strong{display:block;color:var(--navy);font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.4px}.home-btn{border-radius:9px;padding:11px 14px;font-size:13px;font-weight:700;background:#edf3fa;color:var(--navy);white-space:nowrap}main{max-width:760px;margin:28px auto;padding:0 20px 34px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(22px,4vw,36px);box-shadow:0 10px 30px #102b590d}h1{font-size:clamp(26px,4vw,32px);line-height:1.2;color:var(--navy);margin:0 0 12px}.help{color:var(--muted);line-height:1.6;font-size:14px;margin:0 0 20px}label{display:block;font-size:15px;font-weight:700;margin:18px 0 8px}input,select,textarea{display:block;width:100%;min-height:47px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:100px;resize:vertical}input[type=file]{padding:10px;background:#fbfdff}.preview{display:none;max-width:100%;max-height:190px;margin-top:12px;border:1px solid var(--line);border-radius:8px;object-fit:contain}.preview.show{display:block}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:49px;border:0;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;margin-top:22px}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--navy);margin-top:12px}.status{display:none;padding:13px;border-radius:9px;margin-top:15px;font-size:14px;line-height:1.5}.status.show{display:block}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px}@media(max-width:560px){.header-inner{padding:12px 14px}.brand img{width:46px;height:46px}.brand strong{font-size:14px}.brand small{font-size:9px}.home-btn{font-size:12px;padding:9px}main{margin:18px auto;padding:0 12px 24px}.card{padding:22px 17px}} </style></head><body><header><div class="header-inner"><a class="brand" href="home.html"><img src="logo.png" alt="NBCE South Salmara logo"><span><strong>NBCE South Salmara</strong><small>DIGITAL SERVICE CENTRE</small></span></a><a class="home-btn" href="udyam-services.html">← Udyam Services</a></div></header><main><section class="card"><h1>Update Udyam Certificate</h1>
<form id="requestForm" novalidate>
<label for="phone">WhatsApp Number *</label><div style="display:flex;align-items:stretch;gap:0"><span style="display:flex;align-items:center;padding:0 13px;background:#edf3fa;border:1px solid #cbd5e1;border-right:0;border-radius:9px 0 0 9px;font-weight:700;color:var(--navy)">+91</span><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="Enter 10-digit mobile number" required style="border-radius:0 9px 9px 0"></div>
<label for="certificate">Udyam Certificate Photo (optional)</label><div class="upload"><input id="certificate" name="certificate" type="file" accept="image/jpeg,image/png,image/webp"><img id="certificatePreview" class="preview" alt="Selected Udyam certificate preview"><div id="fileName" class="note"></div></div>
<div id="progressBox" style="display:none;margin-top:18px;padding:15px;border:1px solid #cbdaf0;border-radius:10px;background:#f8fbff"><div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:14px;font-weight:700"><span id="progressText">Preparing request…</span><span id="progressPercent">0%</span></div><div style="height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden"><div id="progressBar" style="height:100%;width:0%;background:#2563eb;transition:width .15s"></div></div><button id="cancelUpload" type="button" class="btn secondary" style="margin-top:12px">Cancel Upload</button></div>
<button id="submitBtn" class="btn primary" type="submit">Submit Request →</button></form><div id="status" class="status" role="status" aria-live="polite"></div><a class="btn secondary" href="udyam-services.html">Back to Udyam Services</a></section></main>
<script>
const SUPABASE_URL = "https://hizimlfplecwyqdjvaze.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nV764Rar0ofHGPJAkukczA_vYA_ztNU";
const BUCKET = "customer-documents";
const $ = id => document.getElementById(id);
let activeXhr = null, cancelled = false, uploading = false, uploadedPath = null, hideTimer = null;
function status(message, good=false){const el=$("status");el.textContent=message;el.className="status show";el.style.background=good?'#ecfdf5':'#fff1f1';el.style.color=good?'#065f46':'#9b1c1c';el.style.border=good?'1px solid #a7f3d0':'1px solid #fecdd3';}
function showProgress(text, percent){$("progressBox").style.display='block';$("progressText").textContent=text;const n=Math.max(0,Math.min(100,Math.round(percent)));$("progressPercent").textContent=n+'%';$("progressBar").style.width=n+'%';}
function hideProgressLater(){clearTimeout(hideTimer);hideTimer=setTimeout(()=>{$("progressBox").style.display='none';},2000);}
$("certificate").addEventListener('change',()=>{const f=$("certificate").files[0],img=$("certificatePreview");img.classList.remove('show');img.removeAttribute('src');$("fileName").textContent='';if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){ $("certificate").value='';status('Please select a JPG, PNG or WEBP photo.');return;}if(f.size>8*1024*1024){$("certificate").value='';status('Photo must be smaller than 8 MB.');return;}img.src=URL.createObjectURL(f);img.classList.add('show');$("fileName").textContent=f.name+' ('+(f.size/1024/1024).toFixed(2)+' MB)';});
function uploadFile(file,path){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();activeXhr=xhr;xhr.open('POST',`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);xhr.setRequestHeader('apikey',SUPABASE_ANON_KEY);xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_ANON_KEY);xhr.setRequestHeader('Content-Type',file.type);xhr.setRequestHeader('x-upsert','false');xhr.upload.onprogress=e=>{if(e.lengthComputable)showProgress('Uploading certificate photo…',e.loaded/e.total*90);};xhr.onload=()=>{activeXhr=null;if(xhr.status>=200&&xhr.status<300){uploadedPath=path;showProgress('Saving request…',95);resolve();}else reject(new Error('Photo upload failed ('+xhr.status+'): '+(xhr.responseText||'Check Supabase Storage permissions.')));};xhr.onerror=()=>{activeXhr=null;reject(new Error('Network error during upload.'));};xhr.onabort=()=>{activeXhr=null;reject(new Error('Upload cancelled.'));};xhr.send(file);});}
async function removeUploaded(path){if(!path)return;try{await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`,{method:'DELETE',headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({prefixes:[path]})});}catch(e){}}
$("cancelUpload").addEventListener('click',()=>{cancelled=true;if(activeXhr)activeXhr.abort();$("certificate").value='';$("certificatePreview").classList.remove('show');$("certificatePreview").removeAttribute('src');$("fileName").textContent='';status('Upload cancelled. You can choose another photo and submit again.');$("progressBox").style.display='none';});
$("requestForm").addEventListener('submit',async e=>{e.preventDefault();if(uploading)return;const phone=$("phone").value.trim();if(!/^[6-9]\d{9}$/.test(phone)){status('Enter a valid 10-digit Indian WhatsApp number.');return;}const file=$("certificate").files[0]||null;cancelled=false;uploading=true;uploadedPath=null;$("submitBtn").disabled=true;$("submitBtn").textContent='Submitting…';$("status").className='status';showProgress(file?'Starting upload…':'Saving request…',0);const requestId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));let path=null;try{if(file){const ext=file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';path=`udyam-update/${requestId}/certificate.${ext}`;await uploadFile(file,path);if(cancelled)throw new Error('Upload cancelled.');}const payload={service:'Update Udyam Certificate',whatsapp_number:'+91'+phone,receipt_file_name:file?file.name:'',storage_path:path,status:'pending'};const response=await fetch(`${SUPABASE_URL}/rest/v1/aadhaar_requests`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload)});if(!response.ok)throw new Error('Could not save request ('+response.status+'): '+(await response.text()).slice(0,250));showProgress('Request submitted successfully',100);status('Your Update Udyam Certificate request has been submitted successfully.',true);$("requestForm").reset();$("certificatePreview").classList.remove('show');$("certificatePreview").removeAttribute('src');$("fileName").textContent='';hideProgressLater();}catch(err){if(path&&uploadedPath)await removeUploaded(path);if(!cancelled)status(err.message+' Please check Supabase table/storage permissions and try again.');}finally{uploading=false;$("submitBtn").disabled=false;$("submitBtn").textContent='Submit Request →';if(cancelled){if(path&&uploadedPath)await removeUploaded(path);cancelled=false;}}});
</script></body></html>
