<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102b45"><title>Income Certificate Check | NBCE South Salmara</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--navy:#102b45;--blue:#2563eb;--bg:#f5f7fb;--ink:#172b42;--muted:#687b91;--line:#dbe3ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,Segoe UI,Arial,sans-serif}a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:900px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:58px;height:58px;object-fit:contain}.brand strong{display:block;color:var(--navy);font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.5px}
.home-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:700;background:#edf3fa;color:var(--navy);white-space:nowrap}
main{max-width:760px;margin:auto;padding:28px 22px 42px}h1{font-size:clamp(25px,4vw,34px);margin:0 0 20px;color:var(--navy);letter-spacing:-.7px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 24px rgba(16,43,69,.06)}.field{margin-bottom:20px}label{display:block;font-weight:700;color:var(--navy);margin-bottom:8px}.required{color:#dc2626}.phone-wrap{display:flex;width:100%}.phone-prefix{display:flex;align-items:center;padding:0 14px;background:#edf3fb;border:1px solid #cbd5e1;border-right:0;border-radius:10px 0 0 10px;font-weight:800;color:var(--navy)}input[type=tel]{width:100%;min-width:0;border:1px solid #cbd5e1;border-radius:0 10px 10px 0;padding:13px 14px;font:inherit;color:var(--ink);background:#fff;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.upload-box{border:1.5px dashed #a8bfdc;background:#f8fbff;border-radius:12px;padding:16px}input[type=file]{width:100%;font:inherit;font-size:13px}.preview{display:none;margin-top:12px;max-width:180px;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:white}.file-name{font-size:12px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.submit{width:100%;border:0;border-radius:10px;background:var(--blue);color:white;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer}.submit:hover{background:#1d4ed8}.backlink{display:block;text-align:center;margin-top:18px;color:var(--blue);font-size:13px;font-weight:700}.message{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.message.error{display:block;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}.message.info{display:block;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}.progress-panel{display:none;margin-top:14px;padding:14px;border:1px solid #bfdbfe;background:#f8fbff;border-radius:12px}.progress-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:9px}.progress-track{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.progress-fill{height:100%;width:0;background:#2563eb;transition:width .12s linear}.cancel-upload{margin-top:12px;border:1px solid #dc2626;background:#fff;color:#b91c1c;border-radius:9px;padding:9px 13px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.cancel-upload:disabled{opacity:.5;cursor:not-allowed}.submit:disabled{opacity:.6;cursor:wait}
@media(max-width:560px){.header-inner{padding:12px 14px;gap:8px}.brand img{width:46px;height:46px}.brand strong{font-size:14px}.brand small{font-size:9px}.home-btn{font-size:12px;padding:9px}main{padding:22px 14px 32px}}
</style></head><body>
<header><div class="header-inner"><a class="brand" href="home.html"><img src="logo.png" alt="NBCE South Salmara logo"><span><strong>NBCE South Salmara</strong><small>DIGITAL SERVICE CENTRE</small></span></a><a class="home-btn" href="income-certificate-services.html">← Income Certificate</a></div></header>
<main><h1>Income Certificate Check</h1><form class="form-card" id="requestForm" novalidate>
<div class="field"><label for="whatsapp">WhatsApp Number <span class="required">*</span></label><div class="phone-wrap"><span class="phone-prefix">+91</span><input id="whatsapp" name="whatsapp" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="Enter 10-digit number" required></div></div>
<div class="field"><label for="ackReceipt">Acknowledgement Receipt Photo <span class="required">*</span></label><div class="upload-box"><input id="ackReceipt" name="ackReceipt" type="file" accept="image/jpeg,image/png,image/webp" required><img class="preview" id="ackReceiptPreview" alt="Selected document preview"><div class="file-name" id="ackReceiptName"></div></div></div>
<button class="submit" id="submitButton" type="submit">Submit Request →</button><div id="progressPanel" class="progress-panel" aria-live="polite"><div class="progress-row"><span id="progressLabel">Preparing upload…</span><span id="progressPercent">0%</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><button type="button" class="cancel-upload" id="cancelUpload">Cancel upload</button></div><div id="formMessage" class="message" role="status"></div><a class="backlink" href="income-certificate-services.html">← Back to Income Certificate Services</a></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hizimlfplecwyqdjvaze.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nV764Rar0ofHGPJAkukczA_vYA_ztNU";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const form=document.getElementById('requestForm'),fileInput=document.getElementById('ackReceipt'),phoneInput=document.getElementById('whatsapp');
const msg=document.getElementById('formMessage'),submitButton=document.getElementById('submitButton'),progressPanel=document.getElementById('progressPanel'),progressFill=document.getElementById('progressFill'),progressPercent=document.getElementById('progressPercent'),progressLabel=document.getElementById('progressLabel'),cancelButton=document.getElementById('cancelUpload');
let activeXhr=null,uploadedPath=null,uploading=false,cancelled=false,hideProgressTimer=null;
function showMessage(type,text){msg.className='message '+type;msg.textContent=text;}
function setProgress(value,label){const v=Math.max(0,Math.min(100,Math.round(value)));progressFill.style.width=v+'%';progressPercent.textContent=v+'%';if(label)progressLabel.textContent=label;}
function setupPreview(){const preview=document.getElementById('ackReceiptPreview'),name=document.getElementById('ackReceiptName');fileInput.addEventListener('change',()=>{const file=fileInput.files&&fileInput.files[0];if(!file){preview.style.display='none';preview.removeAttribute('src');name.textContent='';return;}name.textContent=file.name+' ('+(file.size/1024/1024).toFixed(2)+' MB)';if(file.type.startsWith('image/')){preview.src=URL.createObjectURL(file);preview.style.display='block';}else{preview.style.display='none';}});}
setupPreview();
function uploadWithProgress(path,file){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();activeXhr=xhr;xhr.open('POST',`${SUPABASE_URL}/storage/v1/object/customer-documents/${path.split('/').map(encodeURIComponent).join('/')}`);xhr.setRequestHeader('apikey',SUPABASE_ANON_KEY);xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_ANON_KEY);xhr.setRequestHeader('Content-Type',file.type||'image/jpeg');xhr.setRequestHeader('x-upsert','false');xhr.upload.onprogress=e=>{if(e.lengthComputable)setProgress(e.loaded/e.total*100,'Uploading acknowledgement receipt…');};xhr.onload=()=>{activeXhr=null;if(xhr.status>=200&&xhr.status<300)resolve();else{let detail='Storage upload failed ('+xhr.status+')';try{const j=JSON.parse(xhr.responseText);detail=j.message||j.error||detail;}catch{}reject(new Error(detail));}};xhr.onerror=()=>{activeXhr=null;reject(new Error('Network error during upload.'));};xhr.onabort=()=>{activeXhr=null;reject(new Error('UPLOAD_CANCELLED'));};xhr.send(file);});}
async function cleanupUpload(){if(uploadedPath){const path=uploadedPath;uploadedPath=null;try{await supabaseClient.storage.from('customer-documents').remove([path]);}catch(e){console.warn('Could not remove cancelled upload',e);}}}
cancelButton.addEventListener('click',async()=>{if(!uploading)return;cancelled=true;cancelButton.disabled=true;if(activeXhr)activeXhr.abort();await cleanupUpload();progressPanel.style.display='none';showMessage('error','Upload cancelled. You can choose another receipt photo and try again.');submitButton.disabled=false;submitButton.textContent='Submit Request →';cancelButton.disabled=false;});
form.addEventListener('submit',async e=>{e.preventDefault();if(uploading)return;if(!form.reportValidity())return;const phone=phoneInput.value.trim(),file=fileInput.files&&fileInput.files[0];if(!/^[6-9]\d{9}$/.test(phone)){showMessage('error','Enter a valid 10-digit Indian WhatsApp number.');return;}if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)){showMessage('error','Please select a JPG, PNG, or WEBP receipt photo.');return;}if(file.size>8*1024*1024){showMessage('error','Please select an image smaller than 8 MB.');return;}
 uploading=true;cancelled=false;uploadedPath=null;clearTimeout(hideProgressTimer);submitButton.disabled=true;submitButton.textContent='Uploading…';cancelButton.disabled=false;progressPanel.style.display='block';setProgress(0,'Preparing upload…');showMessage('info','Please keep this page open while your request is submitted.');
 try{const requestId=crypto.randomUUID();const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'');const path=`incomeCertificateCheck/${Date.now()}_${crypto.randomUUID()}_${safeName}.${file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg'}`;uploadedPath=path;await uploadWithProgress(path,file);if(cancelled)throw new Error('UPLOAD_CANCELLED');setProgress(100,'Upload complete');progressLabel.textContent='Saving request…';cancelButton.disabled=true;const {error}=await supabaseClient.from('aadhaar_requests').insert({id:requestId,service:'Income Certificate Check',whatsapp_number:'+91'+phone,receipt_file_name:file.name,storage_path:path,status:'pending'});if(error)throw error;uploadedPath=null;showMessage('info',`Request submitted successfully. Reference ID: ${requestId}. The centre can review it in the Member Portal.`);form.reset();const preview=document.getElementById('ackReceiptPreview');preview.style.display='none';preview.removeAttribute('src');document.getElementById('ackReceiptName').textContent='';setProgress(100,'Request submitted successfully');hideProgressTimer=setTimeout(()=>{progressPanel.style.display='none';},2000);
 }catch(err){if(err.message==='UPLOAD_CANCELLED'||cancelled){await cleanupUpload();progressPanel.style.display='none';}else{console.error(err);await cleanupUpload();progressPanel.style.display='none';showMessage('error','Could not submit the request. Check Supabase Storage and database policies. Details: '+(err.message||'Unknown error'));}}finally{uploading=false;activeXhr=null;submitButton.disabled=false;submitButton.textContent='Submit Request →';cancelButton.disabled=false;}
});
</script></body></html>
