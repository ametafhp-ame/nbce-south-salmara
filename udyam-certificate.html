<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102b45">
<title>Udyam Certificate | NBCE South Salmara</title>
<style>
:root{--navy:#102b45;--blue:#2563eb;--bg:#f4f7fb;--ink:#172b42;--muted:#687b91;--line:#dbe3ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:960px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:56px;height:56px;object-fit:contain;flex-shrink:0}.brand strong{display:block;color:var(--navy);font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.4px}.home-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:11px 14px;font-size:13px;font-weight:700;background:#edf3fa;color:var(--navy);white-space:nowrap}main{width:100%;max-width:760px;margin:30px auto;padding:0 20px 34px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(22px,4vw,36px);box-shadow:0 10px 30px #102b590d}h1{font-size:clamp(26px,4vw,32px);line-height:1.2;color:var(--navy);margin:0 0 25px}label{display:block;font-size:15px;font-weight:700;margin:18px 0 8px}input{display:block;width:100%;min-width:0;min-height:49px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;font-size:16px;color:var(--ink);background:#fff}input:focus{outline:2px solid #8db7f0;outline-offset:1px;border-color:var(--blue)}input[type=file]{padding:10px;background:#fbfdff}.upload{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fbfdff}.preview{display:none;margin-top:12px;max-width:100%;max-height:190px;border-radius:8px;border:1px solid var(--line);object-fit:contain}.preview.show{display:block}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:49px;border:0;border-radius:10px;padding:13px 16px;font-size:15px;line-height:1.35;font-weight:700;cursor:pointer;text-align:center;margin-top:22px}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--navy);margin-top:12px}.status{display:none;padding:13px;border-radius:9px;margin-top:15px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.status.show{display:block}.error{background:#fff1f1;color:#9b1c1c}.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}.progress-panel{display:none;margin-top:15px;padding:14px;border:1px solid #bfdbfe;background:#f8fbff;border-radius:12px}.progress-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:9px}.progress-track{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.progress-fill{height:100%;width:0;background:#2563eb;transition:width .12s linear}.cancel-upload{margin-top:12px;border:1px solid #dc2626;background:#fff;color:#b91c1c;border-radius:9px;padding:9px 13px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.cancel-upload:disabled{opacity:.5;cursor:not-allowed}.btn:disabled{opacity:.6;cursor:wait}@media(max-width:560px){.header-inner{padding:12px 14px;gap:8px}.brand img{width:46px;height:46px}.brand strong{font-size:14px}.brand small{font-size:9px}.home-btn{font-size:12px;padding:9px 10px}main{margin:18px auto;padding:0 12px 24px}.card{padding:22px 17px}label{margin-top:16px}.btn{font-size:14px}}
</style></head><body>
<header><div class="header-inner"><a class="brand" href="home.html"><img src="logo.png" alt="NBCE South Salmara logo"><span><strong>NBCE South Salmara</strong><small>DIGITAL SERVICE CENTRE</small></span></a><a class="home-btn" href="home.html">← Home</a></div></header>
<main><section class="card"><h1>Apply for Udyam Certificate</h1>
<form id="udyamForm">
<label for="whatsappNumber">WhatsApp Number *</label><div style="display:flex;width:100%"><span style="display:flex;align-items:center;padding:0 14px;background:#edf3fb;border:1px solid #cbd5e1;border-right:0;border-radius:9px 0 0 9px;font-weight:700;color:var(--navy)">+91</span><input id="whatsappNumber" name="whatsappNumber" type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" autocomplete="tel-national" placeholder="Enter 10-digit number" style="border-radius:0 9px 9px 0" required></div>
<label for="aadhaarPhoto">Aadhaar Card Photo *</label><div class="upload"><input id="aadhaarPhoto" name="aadhaarPhoto" type="file" accept="image/jpeg,image/png,image/webp" required><img id="aadhaarPreview" class="preview" alt="Aadhaar card preview"></div>
<label for="panPhoto">PAN Card Photo *</label><div class="upload"><input id="panPhoto" name="panPhoto" type="file" accept="image/jpeg,image/png,image/webp" required><img id="panPreview" class="preview" alt="PAN card preview"></div>
<button class="btn primary" id="submitButton" type="submit">Submit Udyam Request</button></form>
<div id="progressPanel" class="progress-panel" aria-live="polite"><div class="progress-row"><span id="progressLabel">Preparing upload…</span><span id="progressPercent">0%</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><button type="button" class="cancel-upload" id="cancelUpload">Cancel upload</button></div><div id="status" class="status" role="status" aria-live="polite"></div><a class="btn secondary" href="home.html">Back to Home</a>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hizimlfplecwyqdjvaze.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nV764Rar0ofHGPJAkukczA_vYA_ztNU";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id),form=$("udyamForm"),phoneInput=$("whatsappNumber"),submitButton=$("submitButton"),statusBox=$("status"),progressPanel=$("progressPanel"),progressFill=$("progressFill"),progressPercent=$("progressPercent"),progressLabel=$("progressLabel"),cancelButton=$("cancelUpload");
let activeXhr=null,uploadedPaths=[],uploading=false,cancelled=false,hideProgressTimer=null;
function showStatus(message,type='error'){statusBox.textContent=message;statusBox.className='status show '+type;}
function setProgress(value,label){const v=Math.max(0,Math.min(100,Math.round(value)));progressFill.style.width=v+'%';progressPercent.textContent=v+'%';if(label)progressLabel.textContent=label;}
function previewFile(inputId,previewId){$(inputId).addEventListener('change',()=>{const f=$(inputId).files[0],img=$(previewId);if(!f){img.removeAttribute('src');img.classList.remove('show');return;}if(!['image/jpeg','image/png','image/webp'].includes(f.type)){ $(inputId).value='';img.removeAttribute('src');img.classList.remove('show');showStatus('Please choose a JPG, PNG or WEBP image.');return;}if(f.size>8*1024*1024){$(inputId).value='';img.removeAttribute('src');img.classList.remove('show');showStatus('Each image must be smaller than 8 MB.');return;}img.src=URL.createObjectURL(f);img.classList.add('show');});}
previewFile('aadhaarPhoto','aadhaarPreview');previewFile('panPhoto','panPreview');
function uploadWithProgress(path,file,index,totalBytes,previousBytes){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();activeXhr=xhr;xhr.open('POST',`${SUPABASE_URL}/storage/v1/object/customer-documents/${path.split('/').map(encodeURIComponent).join('/')}`);xhr.setRequestHeader('apikey',SUPABASE_ANON_KEY);xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_ANON_KEY);xhr.setRequestHeader('Content-Type',file.type||'image/jpeg');xhr.setRequestHeader('x-upsert','false');xhr.upload.onprogress=e=>{if(e.lengthComputable){const totalDone=previousBytes+e.loaded;setProgress(totalDone/totalBytes*100,`Uploading ${index===0?'Aadhaar Card':'PAN Card'} photo…`);}};xhr.onload=()=>{activeXhr=null;if(xhr.status>=200&&xhr.status<300)resolve();else{let detail='Storage upload failed ('+xhr.status+')';try{const j=JSON.parse(xhr.responseText);detail=j.message||j.error||detail;}catch{}reject(new Error(detail));}};xhr.onerror=()=>{activeXhr=null;reject(new Error('Network error during upload.'));};xhr.onabort=()=>{activeXhr=null;reject(new Error('UPLOAD_CANCELLED'));};xhr.send(file);});}
async function cleanupUploads(){const paths=[...uploadedPaths];uploadedPaths=[];if(paths.length){try{await supabaseClient.storage.from('customer-documents').remove(paths);}catch(err){console.warn('Could not remove cancelled uploads',err);}}}
cancelButton.addEventListener('click',async()=>{if(!uploading)return;cancelled=true;cancelButton.disabled=true;if(activeXhr)activeXhr.abort();await cleanupUploads();progressPanel.style.display='none';showStatus('Upload cancelled. You can choose new photos and submit again.');submitButton.disabled=false;submitButton.textContent='Submit Udyam Request';});
form.addEventListener('submit',async e=>{e.preventDefault();if(uploading)return;if(!form.reportValidity())return;const phone=phoneInput.value.trim(),aadhaar=$('aadhaarPhoto').files[0],pan=$('panPhoto').files[0];if(!/^[6-9]\d{9}$/.test(phone)){showStatus('Enter a valid 10-digit Indian WhatsApp number.');return;}const files=[{file:aadhaar,label:'Aadhaar Card'},{file:pan,label:'PAN Card'}];for(const item of files){if(!item.file||!['image/jpeg','image/png','image/webp'].includes(item.file.type)){showStatus('Please select JPG, PNG or WEBP photos for both documents.');return;}if(item.file.size>8*1024*1024){showStatus('Each image must be smaller than 8 MB.');return;}}
 uploading=true;cancelled=false;uploadedPaths=[];clearTimeout(hideProgressTimer);submitButton.disabled=true;submitButton.textContent='Uploading…';cancelButton.disabled=false;progressPanel.style.display='block';setProgress(0,'Preparing upload…');showStatus('Please keep this page open while your request is submitted.','info');const totalBytes=files.reduce((sum,x)=>sum+x.file.size,0);let previousBytes=0;
 try{const requestId=crypto.randomUUID();const paths=[];for(let i=0;i<files.length;i++){if(cancelled)throw new Error('UPLOAD_CANCELLED');const file=files[i].file;const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=`udyamCertificate/${Date.now()}_${crypto.randomUUID()}_${safeName}.${ext}`;await uploadWithProgress(path,file,i,totalBytes,previousBytes);uploadedPaths.push(path);paths.push(path);previousBytes+=file.size;if(cancelled)throw new Error('UPLOAD_CANCELLED');}
 setProgress(100,'Saving request…');cancelButton.disabled=true;const {error}=await supabaseClient.from('aadhaar_requests').insert({id:requestId,service:'Udyam Certificate',whatsapp_number:'+91'+phone,receipt_file_name:files.map(x=>x.file.name).join(', '),storage_path:paths[0],status:'pending'});if(error)throw error;uploadedPaths=[];showStatus(`Request submitted successfully. Reference ID: ${requestId}. The centre can review it in the Member Portal.`,'info');form.reset();['aadhaarPreview','panPreview'].forEach(id=>{$(id).removeAttribute('src');$(id).classList.remove('show');});setProgress(100,'Request submitted successfully');hideProgressTimer=setTimeout(()=>{progressPanel.style.display='none';},2000);
 }catch(err){if(err.message==='UPLOAD_CANCELLED'||cancelled){await cleanupUploads();progressPanel.style.display='none';showStatus('Upload cancelled. You can choose new photos and submit again.');}else{console.error(err);await cleanupUploads();progressPanel.style.display='none';showStatus('Could not submit the request. Check Supabase Storage and database policies. Details: '+(err.message||'Unknown error'));}}finally{uploading=false;activeXhr=null;submitButton.disabled=false;submitButton.textContent='Submit Udyam Request';cancelButton.disabled=false;}
});
</script></body></html>
