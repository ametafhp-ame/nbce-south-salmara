<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b45">
<title>Driving Licence Services | NBCE South Salmara</title>
<style>
:root{--navy:#102b45;--blue:#2563eb;--bg:#f4f7fb;--ink:#172b42;--muted:#687b91;--line:#dbe3ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:1000px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:56px;height:56px;object-fit:contain;flex-shrink:0}.brand strong{display:block;color:var(--navy);font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.4px}.home-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:11px 14px;font-size:13px;font-weight:700;background:#edf3fa;color:var(--navy);white-space:nowrap}
main{width:100%;max-width:1000px;margin:28px auto;padding:0 22px 36px}.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.service{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid #d5e0ed;border-radius:15px;padding:22px;min-height:125px;box-shadow:0 5px 16px #102b4508;transition:transform .15s,border-color .15s}.service:hover{transform:translateY(-2px);border-color:#91b4f1}.icon{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center;background:#eaf1ff;border-radius:50%;font-size:29px}.service h2{margin:0;color:var(--navy);font-size:18px;line-height:1.4}.open{display:inline-block;margin-top:10px;color:var(--blue);font-size:12px;font-weight:800}
@media(max-width:600px){.header-inner{padding:12px 14px;gap:8px}.brand img{width:46px;height:46px}.brand strong{font-size:14px}.brand small{font-size:9px}.home-btn{font-size:12px;padding:9px 10px}main{margin:18px auto;padding:0 13px 25px}.services{grid-template-columns:1fr;gap:12px}.service{padding:18px;min-height:105px}.icon{width:50px;height:50px;flex-basis:50px;font-size:25px}.service h2{font-size:17px}}
</style>
</head>
<body>
<header><div class="header-inner"><a class="brand" href="home.html"><img src="logo.png" alt="NBCE South Salmara logo"><span><strong>NBCE South Salmara</strong><small>DIGITAL SERVICE CENTRE</small></span></a><a class="home-btn" href="home.html">← Home</a></div></header>
<main>
<section class="services" aria-label="Driving licence services">
<a class="service" href="apply-learner-licence.html"><div class="icon" aria-hidden="true">📋</div><div><h2>Apply for Learner Licence</h2><span class="open">OPEN SERVICE →</span></div></a>
<a class="service" href="apply-driving-licence.html"><div class="icon" aria-hidden="true">🪪</div><div><h2>Apply for Driving Licence</h2><span class="open">OPEN SERVICE →</span></div></a>
</section>
</main>
</body>
</html>
