<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b45">
<title>Income Certificate Services | NBCE South Salmara</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--navy:#102b45;--blue:#2563eb;--bg:#f5f7fb;--ink:#172b42;--muted:#687b91;--line:#dbe3ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,Segoe UI,Arial,sans-serif}a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:1080px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:58px;height:58px;object-fit:contain}.brand strong{display:block;color:var(--navy);font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.5px}
.home-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:700;background:#edf3fa;color:var(--navy);white-space:nowrap}
main{max-width:1080px;margin:auto;padding:28px 22px 40px}h1{font-size:clamp(25px,4vw,34px);margin:0;color:var(--navy);letter-spacing:-.7px}.status-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0;background:linear-gradient(110deg,#eaf3ff,#f0fbf6);border:1.5px solid #b8d2f2;border-left:5px solid #2563eb;border-radius:12px;padding:17px 20px}.status-row strong{color:var(--navy);font-size:15px}.status{display:inline-flex;align-items:center;gap:8px;background:#d4f8e3;color:#075b35;border:1px solid #8cdbad;padding:10px 13px;border-radius:9px;font-size:13px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#16a05d}
.section-title{font-size:21px;margin:28px 0 14px;color:var(--navy)}.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.service{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid #c7d8ec;border-radius:15px;padding:22px;min-height:150px;transition:transform .15s,border-color .15s,box-shadow .15s;box-shadow:0 4px 12px rgba(16,43,69,.06)}.service:hover{border-color:#2563eb;box-shadow:0 8px 20px rgba(16,43,69,.10);transform:translateY(-2px)}.service-icon{width:60px;height:60px;flex:0 0 60px;display:grid;place-items:center;background:#e5efff;border-radius:13px;font-size:29px}.service h2{font-size:18px;margin:0 0 7px;color:var(--navy)}.service p{font-size:14px;line-height:1.55;margin:0;color:#53677d}.open{display:inline-block;margin-top:10px;color:#1d4ed8;font-size:12px;font-weight:800}.arrow{margin-left:auto;color:var(--blue);font-size:28px;font-weight:700;flex-shrink:0}
@media(max-width:620px){.header-inner{padding:12px 14px;align-items:center;gap:8px}.brand img{width:50px;height:50px}.brand strong{font-size:15px}.brand small{font-size:10px}.home-btn{font-size:12px;padding:9px}main{padding:22px 14px 32px}.status-row{align-items:flex-start;flex-direction:column}.services{grid-template-columns:1fr}.service{padding:18px;min-height:130px}.service-icon{width:54px;height:54px;flex-basis:54px;font-size:26px}.service h2{font-size:17px}}
</style>
</head>
<body>
<header><div class="header-inner"><a class="brand" href="home.html"><img src="logo.png" alt="NBCE South Salmara logo"><span><strong>NBCE South Salmara</strong><small>DIGITAL SERVICE CENTRE</small></span></a><a class="home-btn" href="home.html">← Home</a></div></header>
<main>
  <h1>Income Certificate</h1>
  <section class="status-row" aria-label="Online service availability"><strong>Online Service</strong><div class="status"><span class="dot"></span>Available 24/7</div></section>
  <section><h2 class="section-title">Choose a Service</h2>
    <div class="services">
      <a class="service" href="apply-income-certificate.html"><div class="service-icon" aria-hidden="true">📄</div><div><h2>Apply for Income Certificate</h2><span class="open">OPEN SERVICE →</span></div><span class="arrow" aria-hidden="true">›</span></a>
      <a class="service" href="income-certificate-check.html"><div class="service-icon" aria-hidden="true">🔎</div><div><h2>Income Certificate Check</h2><span class="open">OPEN SERVICE →</span></div><span class="arrow" aria-hidden="true">›</span></a>
    </div>
  </section>
</main>
</body>
</html>
