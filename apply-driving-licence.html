<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102b45"><title>Apply for Driving Licence | NBCE South Salmara</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--navy:#102b45;--blue:#2563eb;--bg:#f5f7fb;--ink:#172b42;--muted:#687b91;--line:#dbe3ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,Segoe UI,Arial,sans-serif}a{text-decoration:none;color:inherit}header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:900px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:58px;height:58px;object-fit:contain}.brand strong{display:block;color:var(--navy);font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.5px}.home-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:700;background:#edf3fa;color:var(--navy);white-space:nowrap}main{max-width:760px;margin:auto;padding:28px 22px 42px}h1{font-size:clamp(25px,4vw,34px);margin:0 0 20px;color:var(--navy);letter-spacing:-.7px}.form-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 24px rgba(16,43,69,.06)}.field{margin-bottom:20px}label{display:block;font-weight:700;color:var(--navy);margin-bottom:8px}.required{color:#dc2626}input[type=tel]{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:13px 14px;font:inherit;color:var(--ink);background:#fff;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}.upload-box{border:1.5px dashed #a8bfdc;background:#f8fbff;border-radius:12px;padding:16px}input[type=file]{width:100%;font:inherit;font-size:13px}.preview{display:none;margin-top:12px;max-width:180px;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:white}.file-name{font-size:12px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}.submit{width:100%;border:0;border-radius:10px;background:var(--blue);color:white;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer}.submit:hover{background:#1d4ed8}.backlink{display:block;text-align:center;margin-top:18px;color:var(--blue);font-size:13px;font-weight:700}.message{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.message.error{display:block;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}.message.info{display:block;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}@media(max-width:560px){.header-inner{padding:12px 14px;gap:8px}.brand img{width:46px;height:46px}.brand strong{font-size:14px}.brand small{font-size:9px}.home-btn{font-size:12px;padding:9px}main{padding:22px 14px 32px}}</style></head><body><header><div class="header-inner"><a class="brand" href="home.html"><img src="logo.png" alt="NBCE South Salmara logo"><span><strong>NBCE South Salmara</strong><small>DIGITAL SERVICE CENTRE</small></span></a><a class="home-btn" href="driving-licence-services.html">← Driving Licence</a></div></header><main><h1>Apply for Driving Licence</h1><form class="form-card" id="requestForm" novalidate><div class="field"><label for="whatsapp">WhatsApp Number <span class="required">*</span></label><div style="display:flex;align-items:stretch"><span style="display:flex;align-items:center;padding:0 13px;background:#edf3fa;border:1px solid #cbd5e1;border-right:0;border-radius:10px 0 0 10px;font-weight:700;color:var(--navy)">+91</span><input id="whatsapp" name="whatsapp" style="border-radius:0 10px 10px 0" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="Enter 10-digit mobile number" required></div></div><div class="field"><label for="aadhaarPhoto">Aadhaar Card Photo <span class="required">*</span></label><div class="upload-box"><input id="aadhaarPhoto" name="aadhaarPhoto" type="file" accept="image/jpeg,image/png,image/webp" required><img class="preview" id="aadhaarPhotoPreview" alt="Aadhaar Card Photo preview"><div class="file-name" id="aadhaarPhotoName"></div></div></div><div class="field"><label for="learnerLicencePhoto">Learner Licence Photo <span class="required">*</span></label><div class="upload-box"><input id="learnerLicencePhoto" name="learnerLicencePhoto" type="file" accept="image/jpeg,image/png,image/webp" required><img class="preview" id="learnerLicencePhotoPreview" alt="Learner Licence Photo preview"><div class="file-name" id="learnerLicencePhotoName"></div></div></div><div id="progressBox" style="display:none;margin:18px 0 0;padding:15px;border:1px solid #cbdaf0;border-radius:10px;background:#f8fbff">
<div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:14px;font-weight:700"><span id="progressText">Preparing request…</span><span id="progressPercent">0%</span></div>
<div style="height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden"><div id="progressBar" style="height:100%;width:0%;background:#2563eb;transition:width .15s"></div></div>
<button id="cancelUpload" type="button" class="submit" style="margin-top:12px;background:#fff;color:#102b45;border:1px solid #dbe3ed">Cancel Upload</button></div><button id="submitBtn" class="submit" type="submit">Submit Request →</button><div id="formMessage" class="message" role="status" aria-live="polite"></div><a class="backlink" href="driving-licence-services.html">← Back to Driving Licence Services</a></form></main><script>
const SUPABASE_URL = "https://hizimlfplecwyqdjvaze.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nV764Rar0ofHGPJAkukczA_vYA_ztNU";
const BUCKET = "customer-documents";
const SERVICE = "Apply for Driving Licence";
const $ = id => document.getElementById(id);
let activeXhr = null, cancelled = false, uploading = false, uploadedPaths = [], hideTimer = null;
function showMessage(text,isError=false){const msg=$("formMessage");msg.className="message "+(isError?"error":"info");msg.textContent=text;}
function showProgress(text, percent){$("progressBox").style.display="block";$("progressText").textContent=text;const n=Math.max(0,Math.min(100,Math.round(percent)));$("progressPercent").textContent=n+"%";$("progressBar").style.width=n+"%";}
function hideProgressLater(){clearTimeout(hideTimer);hideTimer=setTimeout(()=>{$("progressBox").style.display="none";},2000);}
function setupPreview(id){const input=$(id),preview=$(id+"Preview"),name=$(id+"Name");input.addEventListener("change",()=>{const file=input.files&&input.files[0];preview.style.display="none";preview.removeAttribute("src");name.textContent="";if(!file)return;if(!["image/jpeg","image/png","image/webp"].includes(file.type)){input.value="";showMessage("Please choose a JPG, PNG or WEBP image.",true);return;}if(file.size>8*1024*1024){input.value="";showMessage("Each photo must be smaller than 8 MB.",true);return;}name.textContent=file.name+" ("+(file.size/1024/1024).toFixed(2)+" MB)";preview.src=URL.createObjectURL(file);preview.style.display="block";});}
setupPreview("aadhaarPhoto");setupPreview("learnerLicencePhoto");
function uploadFile(file,path,basePercent,rangePercent,label){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();activeXhr=xhr;xhr.open("POST",`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);xhr.setRequestHeader("apikey",SUPABASE_ANON_KEY);xhr.setRequestHeader("Authorization","Bearer "+SUPABASE_ANON_KEY);xhr.setRequestHeader("Content-Type",file.type);xhr.setRequestHeader("x-upsert","false");xhr.upload.onprogress=e=>{if(e.lengthComputable)showProgress("Uploading "+label+"…",basePercent+(e.loaded/e.total*rangePercent));};xhr.onload=()=>{activeXhr=null;if(xhr.status>=200&&xhr.status<300){uploadedPaths.push(path);resolve();}else reject(new Error("Photo upload failed ("+xhr.status+"): "+(xhr.responseText||"Check Supabase Storage permissions.")));};xhr.onerror=()=>{activeXhr=null;reject(new Error("Network error during upload."));};xhr.onabort=()=>{activeXhr=null;reject(new Error("Upload cancelled."));};xhr.send(file);});}
async function removeUploaded(paths){if(!paths||!paths.length)return;try{await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`,{method:"DELETE",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({prefixes:paths})});}catch(e){}}
$("cancelUpload").addEventListener("click",()=>{cancelled=true;if(activeXhr)activeXhr.abort();$("progressBox").style.display="none";for(const id of ["aadhaarPhoto", "learnerLicencePhoto"]){$(id).value="";$(id+"Preview").style.display="none";$(id+"Preview").removeAttribute("src");$(id+"Name").textContent="";}showMessage("Upload cancelled. You can choose the photos again and submit.");});
$("requestForm").addEventListener("submit",async e=>{e.preventDefault();if(uploading)return;const form=e.currentTarget;if(!form.reportValidity())return;const phone=$("whatsapp").value.trim();if(!/^[6-9]\\d{9}$/.test(phone)){showMessage("Enter a valid 10-digit Indian WhatsApp number.",true);return;}
const files=[{id:"aadhaarPhoto",file:$( "aadhaarPhoto" ).files[0],label:"Aadhaar photo"}, {id:"learnerLicencePhoto",file:$( "learnerLicencePhoto" ).files[0],label:"Learner Licence photo"}].filter(x=>x.file);
cancelled=false;uploading=true;uploadedPaths=[];$("submitBtn").disabled=true;$("submitBtn").textContent="Submitting…";showMessage("");showProgress(files.length?"Starting upload…":"Saving request…",0);const requestId=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2));const paths=[];try{let base=0;const perFile=files.length?90/files.length:90;for(const item of files){if(cancelled)throw new Error("Upload cancelled.");const ext=item.file.name.split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=`driving-licence/${requestId}/${item.id}.${ext}`;await uploadFile(item.file,path,base,perFile,item.label);paths.push({field:item.id,path,name:item.file.name});base+=perFile;}if(cancelled)throw new Error("Upload cancelled.");showProgress("Saving request…",95);const payload={service:SERVICE,whatsapp_number:"+91"+phone,receipt_file_name:files.map(x=>x.file.name).join(", "),storage_path:paths.length?paths[0].path:null,status:"pending",additional_note:JSON.stringify({documentFiles:paths})};const response=await fetch(`${SUPABASE_URL}/rest/v1/aadhaar_requests`,{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(payload)});if(!response.ok)throw new Error("Could not save request ("+response.status+"): "+(await response.text()).slice(0,220));showProgress("Request submitted successfully",100);showMessage("Your "+SERVICE+" request has been submitted successfully.");$("requestForm").reset();for(const id of ["aadhaarPhoto", "learnerLicencePhoto"]){$(id+"Preview").style.display="none";$(id+"Preview").removeAttribute("src");$(id+"Name").textContent="";}hideProgressLater();}catch(err){if(uploadedPaths.length)await removeUploaded(uploadedPaths);if(!cancelled)showMessage(err.message+" Please check Supabase table/storage permissions and try again.",true);}finally{uploading=false;$("submitBtn").disabled=false;$("submitBtn").textContent="Submit Request →";if(cancelled){if(uploadedPaths.length)await removeUploaded(uploadedPaths);cancelled=false;}}});
</script></body></html>
